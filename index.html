<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital_logic_sim</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/p5.min.js"></script>
</head>

<body>
  <div class="toolbar">
    <button id="toggle">Change mode</button>
    <span id="modeDisplay">Current mode: Edit</span>
    <div class="inputs">Inputs</div>
    <div class="outputs">Outputs</div>
    <div class="gates">
      Gates
      <br>
      <ul>
        <li>
          <button class="addComponent" data-type="and">AND</button>
        </li>
        <li>
          <button class="addComponent" data-type="or">OR</button>
        </li>
        <li>
          <button class="addComponent" data-type="not">NOT</button>
        </li>
        <li>
          <button class="addComponent" data-type="nand">NAND</button>
        </li>
        <li>
          <button class="addComponent" data-type="nor">NOR</button>
        </li>
        <li>
          <button class="addComponent" data-type="xor">XOR</button>
        </li>
        <li>
          <button class="addComponent" data-type="xnor">XNOR</button>
        </li>
      </ul>
    </div>
  </div>
  <script src="js/logic.js"></script>
  <script src="sketch.js"></script>
</body>

</html>
