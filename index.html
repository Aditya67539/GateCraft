<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GateCraft – Digital Logic Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/p5.min.js"></script>
</head>

<body>

  <!-- ── Top Toolbar ─────────────────────────────────────── -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="5" width="7" height="10" rx="2" fill="#6366f1" />
          <rect x="12" y="5" width="7" height="10" rx="2" fill="#22d3ee" />
          <line x1="8" y1="10" x2="12" y2="10" stroke="#a5b4fc" stroke-width="2" />
          <circle cx="8" cy="10" r="1.5" fill="#a5b4fc" />
          <circle cx="12" cy="10" r="1.5" fill="#a5b4fc" />
        </svg>
        GateCraft
      </span>
    </div>

    <div class="topbar-center">
      <div class="mode-switcher" id="mode-switcher">
        <button class="mode-btn active" data-mode="edit" id="btn-edit">Edit</button>
        <button class="mode-btn" data-mode="run" id="btn-run">Run</button>
        <button class="mode-btn" data-mode="delete" id="btn-delete">Delete</button>
      </div>
    </div>

    <div class="topbar-right">
      <span id="modeDisplay" class="mode-display">Mode: Edit</span>

      <!-- Save circuit as composite gate -->
      <button class="save-gate-btn" id="btn-save-gate" title="Save circuit as composite gate">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
          <polyline points="17 21 17 13 7 13 7 21" />
          <polyline points="7 3 7 8 15 8" />
        </svg>
        Save as Gate
      </button>

      <button class="icon-btn" id="btn-settings" title="Settings" aria-label="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
    </div>
  </header>

  <!-- ── Left Sidebar ────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <p class="sidebar-label">I / O</p>
      <button class="addComponent" data-type="input">Input</button>
      <button class="addComponent" data-type="output">Output</button>
      <button class="addComponent" data-type="clock">Clock</button>
    </div>

    <div class="sidebar-divider"></div>

    <div class="sidebar-section">
      <p class="sidebar-label">Gates</p>
      <button class="addComponent" data-type="and">AND</button>
      <button class="addComponent" data-type="or">OR</button>
      <button class="addComponent" data-type="not">NOT</button>
      <button class="addComponent" data-type="nand">NAND</button>
      <button class="addComponent" data-type="nor">NOR</button>
      <button class="addComponent" data-type="xor">XOR</button>
      <button class="addComponent" data-type="xnor">XNOR</button>
    </div>

    <div class="sidebar-divider"></div>

    <!-- Dynamically populated by toolbar.js -->
    <div class="sidebar-section" id="composite-section">
      <p class="sidebar-label">Composite</p>
    </div>
  </aside>

  <!-- ── Save-as-Gate Modal ─────────────────────────────────── -->
  <div class="modal-overlay" id="save-gate-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <h3 class="modal-title" id="modal-title">Save as Composite Gate</h3>
      <p class="modal-desc">Give this circuit a name. It will appear in the sidebar as a reusable gate.</p>
      <input class="modal-input" id="gate-name-input" type="text" placeholder="e.g. Half Adder" maxlength="32"
        autocomplete="off" />
      <div class="modal-actions">
        <button class="modal-btn cancel" id="modal-cancel-btn">Cancel</button>
        <button class="modal-btn confirm" id="modal-save-btn">Save Gate</button>
      </div>
    </div>
  </div>

  <!-- ── Settings Panel ─────────────────────────────────────── -->
  <div class="settings-overlay" id="settings-overlay">
    <div class="settings-panel" id="settings-panel">
      <div class="settings-header">
        <h3 class="settings-title">Settings</h3>
        <button class="settings-close-btn" id="settings-close-btn" aria-label="Close settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="settings-section">
        <p class="settings-label">Theme</p>
        <div class="theme-grid" id="theme-grid">
          <!-- Populated dynamically by toolbar.js -->
        </div>
      </div>
    </div>
  </div>

  <!-- ── Canvas host (p5 injects here) ──────────────────── -->
  <main class="canvas-host"></main>

  <script type="module" src="sketch.js"></script>
</body>

</html>
