<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GateCraft – Digital Logic Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/p5.min.js"></script>
</head>

<body>

  <!-- ── Top Toolbar ─────────────────────────────────────── -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="5" width="7" height="10" rx="2" fill="#6366f1" />
          <rect x="12" y="5" width="7" height="10" rx="2" fill="#22d3ee" />
          <line x1="8" y1="10" x2="12" y2="10" stroke="#a5b4fc" stroke-width="2" />
          <circle cx="8" cy="10" r="1.5" fill="#a5b4fc" />
          <circle cx="12" cy="10" r="1.5" fill="#a5b4fc" />
        </svg>
        GateCraft
      </span>
    </div>

    <div class="topbar-center">
      <div class="mode-switcher" id="mode-switcher">
        <button class="mode-btn active" data-mode="edit" id="btn-edit" title="Edit (1)" aria-keyshortcuts="1">Edit</button>
        <button class="mode-btn" data-mode="run" id="btn-run" title="Run (2)" aria-keyshortcuts="2">Run</button>
        <button class="mode-btn" data-mode="delete" id="btn-delete" title="Delete (3)" aria-keyshortcuts="3">Delete</button>
      </div>
    </div>

    <div class="topbar-right">
      <span id="modeDisplay" class="mode-display">Mode: Edit</span>

      <!-- Save circuit as composite gate -->
      <button class="save-gate-btn" id="btn-save-gate" title="Save circuit as composite gate (Ctrl + S)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
          <polyline points="17 21 17 13 7 13 7 21" />
          <polyline points="7 3 7 8 15 8" />
        </svg>
        Save as Gate
      </button>

      <button class="save-gate-btn" id="btn-clear-canvas" title="Clear canvas (Ctrl + Shift + X)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6" />
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
          <path d="M10 11v6" />
          <path d="M14 11v6" />
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
        </svg>
        Clear
      </button>

      <button class="icon-btn" id="btn-settings" title="Settings (Ctrl + ,)" aria-label="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
    </div>
  </header>

  <!-- ── Left Sidebar ────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Digital Component Palette</span>
      <button class="sidebar-collapse-btn" id="sidebar-collapse-btn" title="Collapse sidebar (Tab)" aria-label="Collapse sidebar" aria-keyshortcuts="Tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6" />
        </svg>
      </button>
    </div>

    <div class="sidebar-body" id="sidebar-body">
      <div class="sidebar-section" data-section="io">
        <button class="sidebar-section-header" data-toggle="io">
          <span class="sidebar-section-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z" />
              <path d="M2 12h20" />
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
            </svg>
          </span>
          <span class="sidebar-section-label">I/O</span>
          <span class="sidebar-section-chevron">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </span>
        </button>
        <div class="sidebar-section-content scrollable" id="section-io">
          <div class="sidebar-btn-grid">
            <button class="addComponent" data-type="input">Input</button>
            <button class="addComponent" data-type="output">Output</button>
            <button class="addComponent" data-type="clock">Clock</button>
            <button class="addComponent" data-type="seven-seg">7-Segment Display</button>
          </div>
        </div>
      </div>

      <div class="sidebar-section" data-section="gates">
        <button class="sidebar-section-header" data-toggle="gates">
          <span class="sidebar-section-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 6h8a8 8 0 0 1 0 12H4z" />
              <line x1="20" y1="9" x2="16" y2="9" />
              <line x1="20" y1="15" x2="16" y2="15" />
              <line x1="4" y1="9" x2="1" y2="9" />
              <line x1="4" y1="15" x2="1" y2="15" />
            </svg>
          </span>
          <span class="sidebar-section-label">Gates</span>
          <span class="sidebar-section-chevron">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </span>
        </button>
        <div class="sidebar-section-content scrollable" id="section-gates">
          <div class="sidebar-btn-grid">
            <button class="addComponent" data-type="and">AND</button>
            <button class="addComponent" data-type="not">NOT</button>
            <button class="addComponent" data-type="or">OR</button>
            <button class="addComponent" data-type="nor">NOR</button>
            <button class="addComponent" data-type="xor">XOR</button>
            <button class="addComponent" data-type="xnor">XNOR</button>
            <button class="addComponent" data-type="nand">NAND</button>
          </div>
        </div>
      </div>

      <!-- Dynamically populated by toolbar.js -->
      <div class="sidebar-section" id="composite-section" data-section="composite">
        <button class="sidebar-section-header" data-toggle="composite">
          <span class="sidebar-section-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="4" width="16" height="16" rx="2" />
              <rect x="9" y="9" width="6" height="6" />
              <line x1="9" y1="1" x2="9" y2="4" />
              <line x1="15" y1="1" x2="15" y2="4" />
              <line x1="9" y1="20" x2="9" y2="23" />
              <line x1="15" y1="20" x2="15" y2="23" />
              <line x1="20" y1="9" x2="23" y2="9" />
              <line x1="20" y1="14" x2="23" y2="14" />
              <line x1="1" y1="9" x2="4" y2="9" />
              <line x1="1" y1="14" x2="4" y2="14" />
            </svg>
          </span>
          <span class="sidebar-section-label">Composite</span>
          <span class="sidebar-section-chevron">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </span>
        </button>
        <div class="sidebar-section-content scrollable" id="section-composite">
          <div class="sidebar-btn-grid" id="composite-btn-grid">
            <!-- Populated dynamically -->
          </div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Sidebar expand button (visible when collapsed) -->
  <button class="sidebar-expand-btn" id="sidebar-expand-btn" title="Expand sidebar (Tab)" aria-label="Expand sidebar" aria-keyshortcuts="Tab">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6" />
    </svg>
  </button>

  <!-- ── Save-as-Gate Modal ─────────────────────────────────── -->
  <div class="modal-overlay" id="save-gate-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <h3 class="modal-title" id="modal-title">Save as Composite Gate</h3>
      <p class="modal-desc">Give this circuit a name. It will appear in the sidebar as a reusable gate.</p>
      <input class="modal-input" id="gate-name-input" type="text" placeholder="e.g. Half Adder" maxlength="32"
        autocomplete="off" />
      <div class="modal-actions">
        <button class="modal-btn cancel" id="modal-cancel-btn">Cancel</button>
        <button class="modal-btn confirm" id="modal-save-btn">Save Gate</button>
      </div>
    </div>
  </div>

  <!-- Clear canvas modal -->
  <div class="modal-overlay" id="clear-warning-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <h3 class="modal-title" id="modal-title">Clear Canvas</h3>
      <p class="modal-desc">Remove all gates, wires and components from the canvas?</p>
      <div class="modal-actions">
        <button class="modal-btn cancel" id="clear-cancel-btn">Cancel</button>
        <button class="modal-btn confirm" id="clear-confirm-btn">Clear canvas</button>
      </div>
    </div>
  </div>

  <!-- ── Settings Panel ─────────────────────────────────────── -->
  <div class="settings-overlay" id="settings-overlay">
    <div class="settings-panel" id="settings-panel">
      <div class="settings-header">
        <h3 class="settings-title">Settings</h3>
        <button class="settings-close-btn" id="settings-close-btn" aria-label="Close settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="settings-section">
        <p class="settings-label">Theme</p>
        <div class="theme-grid" id="theme-grid">
          <!-- Populated dynamically by toolbar.js -->
        </div>
      </div>
    </div>
  </div>
  <!-- ── Composite Gate Context Menu ─────────────────────────── -->
  <div class="ctx-menu" id="composite-context-menu">
    <button class="ctx-menu-item" id="ctx-rename">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
      </svg>
      Rename
    </button>
    <div class="ctx-menu-divider"></div>
    <button class="ctx-menu-item ctx-menu-danger" id="ctx-delete">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6" />
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
        <path d="M10 11v6" /><path d="M14 11v6" />
      </svg>
      Delete
    </button>
  </div>

  <!-- ── Rename Modal ──────────────────────────────────────────── -->
  <div class="modal-overlay" id="rename-gate-modal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h3 class="modal-title">Rename Gate</h3>
      <p class="modal-desc">Enter a new name for this composite gate.</p>
      <input class="modal-input" id="rename-gate-input" type="text" placeholder="New name" maxlength="32"
        autocomplete="off" />
      <div class="modal-actions">
        <button class="modal-btn cancel" id="rename-cancel-btn">Cancel</button>
        <button class="modal-btn confirm" id="rename-save-btn">Rename</button>
      </div>
    </div>
  </div>

  <!-- ── Custom Tooltip ────────────────────────────────────────── -->
  <div class="sidebar-tooltip" id="sidebar-tooltip"></div>

  <!-- ── Canvas host (p5 injects here) ──────────────────── -->
  <main class="canvas-host"></main>

  <script type="module" src="sketch.js"></script>
</body>

</html>
